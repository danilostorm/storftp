name: Publish v0.1.0 Existing Artifacts

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish v0.1.0
    runs-on: ubuntu-latest
    steps:
      - name: Download successful release artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33441571566
          path: release-assets
          merge-multiple: true

      - name: Collect release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish-assets
          while IFS= read -r -d '' file; do
            cp "$file" "publish-assets/$(basename "$file")"
          done < <(find release-assets -type f -print0)
          test -f publish-assets/StorFTP_0.1.0_x64-setup.exe
          test -f publish-assets/StorFTP_0.1.0_amd64.deb
          test -f publish-assets/StorFTP_0.1.0_amd64.AppImage
          find publish-assets -maxdepth 1 -type f -print

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          files=(publish-assets/StorFTP_0.1.0_x64-setup.exe publish-assets/StorFTP_0.1.0_amd64.deb publish-assets/StorFTP_0.1.0_amd64.AppImage)
          if gh release view v0.1.0 >/dev/null 2>&1; then
            gh release upload v0.1.0 "${files[@]}" --clobber
          else
            gh release create v0.1.0 "${files[@]}" \
              --target "$GITHUB_SHA" \
              --title 'StorFTP v0.1.0' \
              --notes $'Primeira release pública do StorFTP.\n\nInclui:\n- Windows x64: instalador NSIS (.exe)\n- Linux x64: pacote Debian/Ubuntu/Zorin (.deb)\n- Linux x64: AppImage portátil\n- FTP, FTPES, FTPS, SFTP, sistema local e Google Drive\n- Gerenciador de transferências, fila, retomada, histórico e verificação de checksum\n- Builds validados em Windows e Ubuntu.'
          fi
