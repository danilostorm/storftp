name: Bootstrap StorFTP source

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct source tree
        shell: bash
        run: |
          cat .bootstrap/part* | base64 -d > /tmp/storftp.tar.gz
          tar -xzf /tmp/storftp.tar.gz
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Commit complete StorFTP implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement StorFTP provider architecture and transfer engine"
          git push origin main
